# WaveSynAgent — nginx site config
# Place at: /etc/nginx/sites-available/wavesynagent
# Symlink:  /etc/nginx/sites-enabled/wavesynagent
# Reload:   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    # Accessed via the public IP. metagaruta.com keeps the default_server slot.
    server_name 20.243.161.134;

    # Static frontend (built by Vite). Lives under /var/www so nginx (www-data)
    # can read it without needing access to /home/animnia (which is mode 750).
    root /var/www/wavesynagent;
    index index.html;

    # Tweak limits — long AI responses can be a few MB
    client_max_body_size 4m;

    # ---- Agent server (FastAPI, port 3002) ----
    # Frontend calls /agent-api/... and /agent-api/api/agent/ws
    location /agent-api/ {
        # Strip the /agent-api prefix before forwarding
        rewrite ^/agent-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming AI responses can be slow — give them room
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html — its asset hashes change every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Cache hashed Vite assets aggressively
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# Map for WebSocket upgrade header (placed in http {} block via conf.d)
# This file ships its own snippet under deploy/nginx/upgrade-map.conf
