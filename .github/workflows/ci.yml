name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: packages/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/frontend
        run: pnpm exec tsc -b

      - name: Unit tests
        working-directory: packages/frontend
        run: pnpm test

      - name: Param-spec mirror is fresh
        working-directory: packages/frontend
        run: pnpm gen:params --check

  api-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Install dependencies
        working-directory: packages/api-server
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api-server
        run: pnpm db:generate

      - name: Typecheck
        working-directory: packages/api-server
        run: pnpm exec tsc --noEmit

  agent-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: packages/agent-server
        run: uv sync

      - name: Scenario & tool tests
        working-directory: packages/agent-server
        run: uv run pytest -q
